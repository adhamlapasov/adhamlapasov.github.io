<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayl Yuborish</title>
  
  <script>
    // Saytga kirish paroli (shuni o'zingiz xohlagan parolga o'zgartiring)
    const MAXFIY_PAROL = "7777";

    // Sahifa yuklanishidan oldin parol so'raladi
    let kiritilganParol = prompt("Saytga kirish uchun parolni kiriting:");

    if (kiritilganParol !== MAXFIY_PAROL) {
      alert("Parol noto'g'ri! Kirish rad etildi.");
      // Parol xato bo'lsa, foydalanuvchini Google'ga yuboradi
      window.location.href = "https://google.com";
    }
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8fafc;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* Sichqoncha ustiga kelganda */
    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(79, 70, 229, 0.5);
      background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%);
    }

    /* Tugma bosilganda */
    .upload-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 10px 0 rgba(79, 70, 229, 0.3);
    }
  </style>
</head>
<body>

  <a href="https://forms.gle/ntpeoEDk9BF54oqq7" target="_blank" class="upload-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    Fayl yuklash
  </a>

</body>
</html>
