<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fayl Yuborish</title>

  <script>
    const MAXFIY_PAROL = "1255";
    let kiritilganParol = MAXFIY_PAROL;

    if (kiritilganParol !== MAXFIY_PAROL) {
      alert("Parol noto'g'ri! Kirish rad etildi.");
      window.location.href = "https://adhamlapasov.github.io";
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      padding: 20px;
    }

    .main-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .header-text {
      text-align: center;
    }

    .header-text h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header-text p {
      font-size: 14px;
      color: #94a3b8;
    }

    .upload-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(99, 102, 241, 0.6);
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
    }

    .upload-btn:active {
      transform: translateY(0);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .global-controls {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .global-btn {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .global-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .global-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      border-color: transparent;
    }

    table.track-table {
      width: 100%;
      border-collapse: collapse;
    }

    table.track-table td {
      padding: 10px 0;
      vertical-align: middle;
    }

    table.track-table td.track-name {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      white-space: nowrap;
      padding-right: 12px;
      width: 1%;
    }

    table.track-table td.track-player {
      width: 100%;
    }

    table.track-table td.track-repeat {
      padding-left: 10px;
      width: 1%;
    }

    audio {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      outline: none;
    }

    audio::-webkit-media-controls-panel {
      background-color: #334155;
    }

    .repeat-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .repeat-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .repeat-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      border-color: transparent;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="header-text">
      <h2>Fayl yuklash oynasi</h2>
    </div>

    <!-- Google Forms tugmasi -->
    <a href="https://forms.gle/ntpeoEDk9BF54oqq7" target="_blank" class="upload-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Fayl yuklash
    </a>

    <div class="divider"></div>

    <!-- Global takrorlash tugmalari -->
    <div class="global-controls">
      <button class="global-btn" id="repeatAllBtn" onclick="toggleRepeatAll()">Repeat All</button>
      <button class="global-btn" id="repeatPlaylistBtn" onclick="toggleRepeatPlaylist()">Repeat Playlist</button>
    </div>

    <!-- Musiqa jadvali -->
    <table class="track-table">
      <tr>
        <td class="track-name">Isloh</td>
        <td class="track-player"><audio controls id="a1"><source src="Isloh.mp3" type="audio/mpeg"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a1" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
      <tr>
        <td class="track-name">Boshqa variant yo'q</td>
        <td class="track-player"><audio controls id="a2"><source src="Ilm-yo'li.m4a" type="audio/mp4"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a2" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
      <tr>
        <td class="track-name">Sening..</td>
        <td class="track-player"><audio controls id="a3"><source src="Sening.m4a" type="audio/mp4"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a3" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
      <tr>
        <td class="track-name">Ey Oshiq</td>
        <td class="track-player"><audio controls id="a4"><source src="Ey-oshiq.m4a" type="audio/mp4"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a4" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
      <tr>
        <td class="track-name">ILM yo'li</td>
        <td class="track-player"><audio controls id="a5"><source src="Ilm-yoli.mp3" type="audio/mpeg"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a5" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
      <tr>
        <td class="track-name">Axloqlarni sayqallash</td>
        <td class="track-player"><audio controls id="a6"><source src="Axloqlarni-sayqallash.mp3" type="audio/mpeg"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a6" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
      <tr>
        <td class="track-name">Haqiqiy islohot</td>
        <td class="track-player"><audio controls id="a7"><source src="Haqiqiy-islohot.mp3" type="audio/mpeg"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a7" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
      <tr>
        <td class="track-name">Muxabbat</td>
        <td class="track-player"><audio controls id="a8"><source src="Muxabbat.mp3" type="audio/mpeg"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a8" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
        <tr>
        <td class="track-name">Dunyo</td>
        <td class="track-player"><audio controls id="a8"><source src="Dunyo.mp3" type="audio/mpeg"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a8" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
      <tr>
        <td class="track-name">Ubudiyat yo'li</td>
        <td class="track-player"><audio controls id="a8"><source src="Ubudiyat-yo'li.mp3" type="audio/mpeg"></audio></td>
        <td class="track-repeat"><button class="repeat-btn" data-audio="a8" onclick="toggleRepeat(this)">🔁</button></td>
      </tr>
    </table>
  </div>

  <script>
    const trackIds = ["a1", "a2", "a3", "a4", "a5", "a6", "a7", "a8"];
    let playlistRepeatOn = false;

    function toggleRepeat(btn) {
      const audio = document.getElementById(btn.dataset.audio);
      audio.loop = !audio.loop;
      btn.classList.toggle('active', audio.loop);
    }

    function toggleRepeatAll() {
      const btn = document.getElementById('repeatAllBtn');
      const turningOn = !btn.classList.contains('active');

      if (turningOn) {
        playlistRepeatOn = false;
        document.getElementById('repeatPlaylistBtn').classList.remove('active');
      }

      trackIds.forEach(id => {
        const audio = document.getElementById(id);
        audio.loop = turningOn;
        document.querySelector(`.repeat-btn[data-audio="${id}"]`).classList.toggle('active', turningOn);
      });

      btn.classList.toggle('active', turningOn);
    }

    function toggleRepeatPlaylist() {
      const btn = document.getElementById('repeatPlaylistBtn');
      playlistRepeatOn = !playlistRepeatOn;
      btn.classList.toggle('active', playlistRepeatOn);

      if (playlistRepeatOn) {
        document.getElementById('repeatAllBtn').classList.remove('active');
        trackIds.forEach(id => {
          const audio = document.getElementById(id);
          audio.loop = false;
          document.querySelector(`.repeat-btn[data-audio="${id}"]`).classList.remove('active');
        });
      }
    }

    trackIds.forEach((id, index) => {
      const audio = document.getElementById(id);
      audio.addEventListener('ended', () => {
        if (!playlistRepeatOn) return;
        const nextIndex = (index + 1) % trackIds.length;
        document.getElementById(trackIds[nextIndex]).play();
      });
    });
  </script>

</body>
</html>
